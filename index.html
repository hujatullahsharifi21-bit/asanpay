<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AsanPay - آسان پرداخت</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f7fb;color:#1a1a2e}
.header{background:#0f0c29;color:#fff;padding:24px 18px 80px;text-align:center}
.logo{font-weight:700;font-size:22px}
.card{background:#fff;margin:-60px 18px 20px;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.bal-label{color:#888;font-size:13px}
.bal{font-size:32px;font-weight:700;margin:6px 0}
.bal span{font-size:18px;color:#666}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.btn{padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer}
.btn-primary{background:#0f0c29;color:#fff}
.btn-light{background:#f5f7fb}
.item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div class="header"><div class="logo">AsanPay - آسان</div></div>
<div class="card">
<div class="bal-label">موجودی کل</div>
<div class="bal">1,250 <span>افغانی</span></div>
<div class="actions">
<button class="btn btn-primary">پرداخت</button>
<button class="btn btn-light">دریافت</button>
</div>
<div style="margin-top:22px">
<div class="item"><span>کارت بانکی</span><span>**** 1234</span></div>
<div class="item"><span>تراکنش امروز</span><span>-120 افغانی</span></div>
</div>
</div>
</body>
</html>
